# .golangci.yml — golangci-lint configuration for the campfire reference implementation.
#
# Layer-boundary enforcement (design v2 §4.6):
#   L1 = cf-protocol/ (substrate: message envelope, signatures, store, transports)
#   L2 = cf-conventions/cf-convention/ (convention machinery: parser, executor, dispatcher, server)
#   L3 = cf-conventions/cf-convention-extension/* (applied conventions: identity, connect, billing, delegation)
#      + pkg/trust, pkg/naming (legacy L3; pending migration to cf-convention-extension)
#
# Legacy L2 path (pkg/convention/) has been removed (campfireagent-4d7). Rules referencing
# pkg/convention are retained as tombstones to catch accidental re-introduction of deleted imports.
#
# See CONTRIBUTING.md §Cross-Layer Import Policy for the full policy,
# exemption process, and list of tracked allowances.

version: "2"

linters:
  default: none
  enable:
    - depguard

  settings:
    depguard:
      rules:
        # Default rule: lax mode (deny-only). This overrides depguard's built-in
        # default allowlist (which only permits stdlib), making all project imports
        # allowed unless a more specific rule below denies them.
        #
        # The deny entry is a non-existent package used purely to satisfy depguard's
        # requirement that each rule have at least one allow OR deny entry.
        main-allow-all:
          list-mode: lax
          deny:
            - pkg: "github.com/campfire-net/campfire/internal/DEPGUARD_PLACEHOLDER_NONEXISTENT"
              desc: "placeholder — do not remove; required to activate lax (deny-only) mode for all other imports"

        # B1 — L1 must not import L2.
        #
        # pkg/protocol is the Layer-1 campfire substrate: message envelope, signatures,
        # hop chain, store interface, transports. It must not import convention machinery.
        # Convention machinery depends on the protocol substrate, not the reverse.
        #
        # Applies to: all non-test files directly inside pkg/protocol.
        # Exempt: *_test.go files, which may cross layers for integration tests.
        #
        # Tracked allowances: none. This boundary is currently clean.
        #
        # To add an allowance: follow CONTRIBUTING.md §Cross-Layer Import Policy.
        L1-no-convention:
          list-mode: lax
          files:
            - "**/pkg/protocol/**/*.go"
            - "**/pkg/protocol/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/campfire-net/campfire/pkg/convention"
              desc: "B1: L1 (pkg/protocol) must not import L2 (legacy pkg/convention). See CONTRIBUTING.md §Cross-Layer Import Policy (design v2 §4.6)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention"
              desc: "B1: L1 (pkg/protocol) must not import L2 (cf-conventions/cf-convention). See CONTRIBUTING.md §Cross-Layer Import Policy (design v2 §4.6)"

        # B2 — L2 must not import L3.
        #
        # cf-conventions/cf-convention/ is the Layer-2 convention machinery. It declares
        # interfaces (GateEvaluator, ProvenanceChecker) whose default implementations live
        # in L3 (pkg/trust, pkg/naming). The machinery must not import its own implementations.
        #
        # Applies to: all non-test, non-exempted files in cf-conventions/cf-convention/.
        # Exempt: *_test.go files, seed.go, parser.go (tracked allowances, see below).
        #
        # Tracked allowances:
        #   - cf-conventions/cf-convention/seed.go — imports pkg/naming for TagNamePrefix/TagPrefix
        #     constants. Pending: Stage 3 refactor may extract these constants to a shared package.
        #     Citation: design v2 §4.3, OPEN-018.
        #
        #   - cf-conventions/cf-convention/parser.go — imports pkg/naming for TagPrefix constants
        #     used in the parser's deny list. Pending: same migration as seed.go; or
        #     extract TagPrefix constants to a shared L1/L2 package (pkg/tagspec).
        #     Citation: design v2 §4.1 (internal/tagspec extraction), OPEN-018.
        #
        # Note: legacy path pkg/convention/ no longer exists (moved in campfireagent-4d7).
        #
        # To add an allowance: follow CONTRIBUTING.md §Cross-Layer Import Policy.
        L2-no-naming:
          list-mode: lax
          files:
            - "**/cf-conventions/cf-convention/**/*.go"
            - "**/cf-conventions/cf-convention/*.go"
            - "!**/cf-conventions/cf-convention/seed.go"
            - "!**/cf-conventions/cf-convention/parser.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/campfire-net/campfire/pkg/naming"
              desc: "B2: L2 (cf-conventions/cf-convention) must not import L3 (pkg/naming). See CONTRIBUTING.md §Cross-Layer Import Policy (design v2 §4.6). Exemptions for seed.go and parser.go are tracked in CONTRIBUTING.md pending §4.3 migration."

        # L1-narrow — cf-protocol/ must not import cf-conventions (or any future L2/L3 layer).
        #
        # cf-protocol/ is the Layer-1 substrate module. Its public packages and
        # internal/ sub-packages must never import convention machinery, authority
        # evaluators, or any other L2/L3 package. The only allowed imports are
        # stdlib, external deps, and other cf-protocol/ packages.
        #
        # Applies to: all non-test Go files under cf-protocol/.
        # Exempt: *_test.go files, which may use test infrastructure.
        #
        # This is the design v2 §4.6 L1-narrow rule applied to the cf-protocol
        # directory. When cf-protocol becomes a separate go module, this rule
        # will enforce the module boundary via go.mod instead.
        #
        # Adversarial test: cf-protocol/protocol/depguard_test.go proves this
        # rule fires on an intentional violation.
        # Note on pkg patterns: golangci-lint depguard matches pkg paths as prefix strings;
        # the /** suffix is not a real glob. Each cf-conventions sub-package is denied by exact path.
        # Add a deny entry here whenever a new cf-conventions/* package is added.
        L1-narrow:
          list-mode: lax
          files:
            - "**/cf-protocol/**/*.go"
            - "**/cf-protocol/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/campfire-net/campfire/cf-conventions"
              desc: "L1-narrow: cf-protocol/ must not import cf-conventions (L2). See design v2 §4.6"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention"
              desc: "L1-narrow: cf-protocol/ must not import cf-conventions/cf-convention (L2 machinery). See design v2 §4.6"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention-extension/identity"
              desc: "L1-narrow: cf-protocol/ must not import L3 extension identity. See design v2 §4.6"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-connect"
              desc: "L1-narrow: cf-protocol/ must not import L3 extension connect. See design v2 §4.6"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention-extension/billing"
              desc: "L1-narrow: cf-protocol/ must not import L3 extension billing. See design v2 §4.6"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention-extension/delegation"
              desc: "L1-narrow: cf-protocol/ must not import L3 extension delegation. See design v2 §4.6"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention-extension"
              desc: "L1-narrow: cf-protocol/ must not import L3 cf-convention-extension top-level package. See design v2 §4.6 (campfireagent-a40)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-authority"
              desc: "L1-narrow: cf-protocol/ must not import cf-conventions/cf-authority (L3). See design v2 §4.6"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-durability"
              desc: "L1-narrow: cf-protocol/ must not import cf-conventions/cf-durability (L3). See design v2 §4.6 (campfireagent-122)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-identity"
              desc: "L1-narrow: cf-protocol/ must not import cf-conventions/cf-identity (L3). See design v2 §4.6 (campfireagent-902)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-discovery"
              desc: "L1-narrow: cf-protocol/ must not import cf-conventions/cf-discovery (L3). See design v2 §4.6 (campfireagent-550)"
            - pkg: "github.com/campfire-net/campfire/pkg/convention"
              desc: "L1-narrow: cf-protocol/ must not import convention machinery (legacy L2 path; removed in campfireagent-4d7). See design v2 §4.6"

        # L1-protocol-no-pkgprotocol — cf-protocol/protocol/ must not import pkg/protocol.
        #
        # After campfireagent-9f4 (substrate strip-and-ship), cf-protocol/protocol/
        # is the SOURCE of truth for protocol types. pkg/protocol no longer exists as
        # a real package (it was emptied; all code moved here). Any future accidental
        # import of pkg/protocol from cf-protocol/protocol/ would create a circular
        # dependency or import of a non-existent package.
        #
        # This rule also prevents re-importing the substrate packages that were moved
        # out of pkg/ and into cf-protocol/ (campfireagent-9f4 §4.1 compliance).
        #
        # Applies to: all non-test Go files in cf-protocol/protocol/.
        # Adversarial test: depguard_test.go TestDepguardL1NarrowCatchesForbiddenImport.
        L1-protocol-no-pkgprotocol:
          list-mode: lax
          files:
            - "**/cf-protocol/protocol/**/*.go"
            - "**/cf-protocol/protocol/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/campfire-net/campfire/pkg/protocol"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/protocol (circular; pkg/protocol is now empty after campfireagent-9f4 substrate move). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/campfire"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/campfire (moved to cf-protocol/campfire/ by campfireagent-9f4). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/message"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/message (moved to cf-protocol/message/ by campfireagent-9f4). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/store"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/store (moved to cf-protocol/store/ by campfireagent-9f4). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/encoding"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/encoding (moved to cf-protocol/encoding/ by campfireagent-9f4). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/crypto"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/crypto (moved to cf-protocol/crypto/ by campfireagent-9f4). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/threshold"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/threshold (moved to cf-protocol/threshold/ by campfireagent-9f4). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/transport/fs"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/transport/fs (moved to cf-protocol/transport/fs/ by campfireagent-9f4). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/transport/http"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/transport/http (moved to cf-protocol/transport/http/ by campfireagent-9f4). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/predicate"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/predicate (moved to cf-protocol/predicate/ by campfireagent-9f4). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/projection"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/projection (moved to cf-protocol/projection/ by campfireagent-9f4). See design v2 §4.1"
            - pkg: "github.com/campfire-net/campfire/pkg/admission"
              desc: "L1-protocol: cf-protocol/protocol/ must not import pkg/admission (moved to cf-protocol/admission/ by campfireagent-9f4). See design v2 §4.1"

        # no-pkg-durability — pkg/durability was moved to cf-conventions/cf-durability/ in v0.30.0 (campfireagent-122).
        #
        # This rule prevents re-introduction of the deleted package path.
        # Use github.com/campfire-net/campfire/cf-conventions/cf-durability instead.
        no-pkg-durability:
          list-mode: lax
          files:
            - "**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/campfire-net/campfire/pkg/durability"
              desc: "pkg/durability was moved to cf-conventions/cf-durability/ (campfireagent-122). Use cf-conventions/cf-durability instead."

        # no-github-transport — pkg/transport/github was removed in v0.30.0 (campfireagent-964).
        #
        # This rule prevents re-introduction of the deleted package. Any import of
        # pkg/transport/github in any non-test Go file is a build-breaking mistake.
        #
        # TypeGitHub and GitHubTransport tombstones in cf-protocol/protocol/ are retained
        # for backward compat with legacy store records, but the transport package itself
        # is gone and must not be re-imported.
        #
        # Adversarial test: test/demo/32-github-transport-cut.sh (check 2).
        no-github-transport:
          list-mode: lax
          files:
            - "**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/campfire-net/campfire/pkg/transport/github"
              desc: "GitHub transport was removed in v0.30.0 (campfireagent-964). Use FilesystemTransport or P2PHTTPTransport instead. See CHANGELOG.md."

        # L1-internal-encapsulation — external code must not import cf-protocol/internal/.
        #
        # After campfireagent-401d (substrate move to internal/), the substrate packages
        # live at cf-protocol/internal/*. Go's internal/ rule already enforces this at
        # compile time, but this depguard rule makes violations visible in lint output
        # with a clear explanatory message.
        #
        # External consumers (cmd/, bridge/, pkg/, tests/) must use:
        #   - cf-protocol/protocol/ for SDK types and high-level operations
        #   - cf-protocol/{campfire,message,store,...} for the public forwarding wrappers
        #
        # Applies to: all non-test Go files NOT under cf-protocol/.
        # Exempt: *_test.go files (may use internal types via test helpers).
        #
        # Adversarial test: cf-protocol/protocol/depguard_test.go
        # TestDepguardL1InternalEncapsulation (added in campfireagent-401d).
        L1-internal-encapsulation:
          list-mode: lax
          files:
            - "**/*.go"
            - "!**/cf-protocol/**/*.go"
            - "!**/cf-protocol/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/campfire-net/campfire/cf-protocol/internal"
              desc: "L1-internal: external code must not import cf-protocol/internal/ directly. Use cf-protocol/protocol/ or the public forwarding wrappers (cf-protocol/{campfire,message,store,...}). See design v2 §4.1 (campfireagent-401d)"
            - pkg: "github.com/campfire-net/campfire/cf-protocol/internal/**"
              desc: "L1-internal: external code must not import cf-protocol/internal/ sub-packages. Use cf-protocol/protocol/ or the public forwarding wrappers. See design v2 §4.1 (campfireagent-401d)"

        # B3 — L3 must not import L2 internal sub-packages.
        #
        # L3 implementations (pkg/trust, pkg/naming) are permitted to import the public
        # cf-conventions/cf-convention API. They must NOT import internal sub-packages or
        # the delegation extension (which is itself L3 and cross-L3 imports are forbidden):
        #   - cf-conventions/cf-convention-extension/delegation (L3 extension, not L2 API)
        #
        # Note: pkg/convention/delegation and pkg/convention/declarations no longer exist
        # (delegation moved to cf-convention-extension/delegation/ in campfireagent-4d7;
        # declarations/ was absorbed into cf-convention/ machinery).
        #
        # Applies to: all non-test files in pkg/trust and pkg/naming.
        # Tracked allowances: none. This boundary is currently clean.
        L3-no-convention-internals:
          list-mode: lax
          files:
            - "**/pkg/trust/**/*.go"
            - "**/pkg/trust/*.go"
            - "**/pkg/naming/**/*.go"
            - "**/pkg/naming/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/campfire-net/campfire/pkg/convention/delegation"
              desc: "B3: legacy path (removed in campfireagent-4d7) — if this fires, a deleted import was re-added. See CONTRIBUTING.md §Cross-Layer Import Policy (design v2 §4.6)"
            - pkg: "github.com/campfire-net/campfire/pkg/convention/declarations"
              desc: "B3: legacy path (removed in campfireagent-4d7) — if this fires, a deleted import was re-added. See CONTRIBUTING.md §Cross-Layer Import Policy (design v2 §4.6)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention-extension/delegation"
              desc: "B3: L3 (pkg/trust, pkg/naming) must not import another L3 extension (delegation). See CONTRIBUTING.md §Cross-Layer Import Policy (design v2 §4.6)"

        # L2-no-extensions — cf-conventions/cf-convention/ (L2 machinery) must not import L3.
        #
        # cf-conventions/cf-convention/ is the Layer-2 convention machinery (parser, executor,
        # dispatcher, server, dispatch_store, sweep, toolgen, builder, lint). The applied-convention
        # implementations live in cf-conventions/cf-convention-extension/* (L3):
        #   - cf-convention-extension/identity/ — identity convention semantics
        #   - cf-connect/   — social/connect convention
        #   - cf-convention-extension/billing/   — billing sweep convention
        #   - cf-convention-extension/delegation/ — delegation convention
        #
        # The L2 machinery declares interfaces (GateEvaluator, ProvenanceChecker) whose
        # default implementations live in L3. The machinery must not import its own
        # implementations — that would invert the dependency and create a cycle.
        #
        # Applies to: all non-test, non-exempted files in cf-conventions/cf-convention/.
        # Exempt: *_test.go files, which may cross layers for integration tests.
        #
        # Tracked allowances:
        #   - cf-conventions/cf-convention/identity_resolver.go — imports cf-convention-extension/delegation
        #     for delegation.GrantInfo and delegation.Resolve used by GrantChainResolver and CompositeResolver.
        #     Pending: Stage 3 will move GrantChainResolver to cf-convention-extension, leaving only
        #     the IdentityResolver interface and NoopIdentityResolver in L2 machinery. Once moved,
        #     this exemption and file exclusion are removed. Citation: campfireagent-4d7 Stage 2 scaffold,
        #     OPEN-018.
        #
        # Note on pkg patterns: golangci-lint depguard matches pkg paths as prefix strings;
        # the /** suffix is not a real glob. Each L3 extension package is denied by exact path.
        # Add a deny entry here whenever a new cf-convention-extension/<name> package is added.
        #
        # Adversarial test: cf-conventions/cf-convention/depguard_test.go
        # TestDepguardL2NoExtensionsCatchesForbiddenImport (added in campfireagent-4d7).
        L2-no-extensions:
          list-mode: lax
          files:
            - "**/cf-conventions/cf-convention/**/*.go"
            - "**/cf-conventions/cf-convention/*.go"
            - "!**/*_test.go"
            - "!**/cf-conventions/cf-convention/identity_resolver.go"
          deny:
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention-extension/identity"
              desc: "L2-no-extensions: L2 machinery (cf-convention/) must not import L3 extension identity. See design v2 §4.6 (campfireagent-4d7)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-connect"
              desc: "L2-no-extensions: L2 machinery must not import L3 extension connect. See design v2 §4.6 (campfireagent-4d7)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention-extension/billing"
              desc: "L2-no-extensions: L2 machinery must not import L3 extension billing. See design v2 §4.6 (campfireagent-4d7)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention-extension/delegation"
              desc: "L2-no-extensions: L2 machinery must not import L3 extension delegation (OPEN-018: identity_resolver.go exempt pending Stage 3 refactor). See design v2 §4.6 (campfireagent-4d7)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-convention-extension"
              desc: "L2-no-extensions: L2 machinery must not import L3 cf-convention-extension top-level package (promote/supersede ops). See design v2 §4.6 (campfireagent-a40)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-identity"
              desc: "L2-no-extensions: L2 machinery (cf-convention/) must not import L3 cf-identity. See design v2 §4.6 (campfireagent-902)"
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-discovery"
              desc: "L2-no-extensions: L2 machinery (cf-convention/) must not import L3 cf-discovery. See design v2 §4.6 (campfireagent-550)"

        # L2-no-authority — cf-conventions/cf-convention/ (L2 machinery) must not import L3 authority.
        #
        # cf-conventions/cf-authority/ is the Layer-3 authority package: GateEvaluator default
        # implementation, conformance harness, chain walker, grant CBOR layout. The L2 machinery
        # declares the GateEvaluator INTERFACE (cf-convention/gate_evaluator.go) whose default
        # implementation lives in cf-authority/trust. The machinery must not import its own
        # implementation — that would invert the dependency (L3 satisfies L2 interface, not reverse).
        #
        # Applies to: all non-test files in cf-conventions/cf-convention/.
        # Exempt: *_test.go files (integration tests may probe cross-layer behaviour).
        #
        # Adversarial test: cf-conventions/cf-convention/gate_evaluator_test.go
        # TestDepguardL2NoCfAuthorityCatchesForbiddenImport (added in campfireagent-2b9).
        L2-no-authority:
          list-mode: lax
          files:
            - "**/cf-conventions/cf-convention/**/*.go"
            - "**/cf-conventions/cf-convention/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/campfire-net/campfire/cf-conventions/cf-authority"
              desc: "L2-no-authority: L2 machinery (cf-convention/) must not import L3 authority (cf-authority/). See design v2 §4.6 (campfireagent-2b9)"
