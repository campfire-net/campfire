name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run golangci-lint (depguard layer boundaries)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          args: --fast-only

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10002:10002
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./cf-protocol/protocol/... ./cf-conventions/... -timeout 300s

      - name: Run Azurite integration tests
        run: go test -tags azurite -v ./pkg/store/aztable/...

      - name: Build check
        run: go build ./cmd/cf ./cmd/cf-mcp ./cmd/cf-functions

      - name: Vet
        run: go vet ./...

      - name: Wire-format freeze snapshot verifier (Phase 8 Gate 4)
        # Asserts that every claim in docs/0.30-wire-format-freeze.md (the S0q snapshot)
        # matches the actual code at HEAD. Catches spec/code drift before it reaches
        # a release tag. See cf-protocol/internal/wireverify/ and campfireagent-3a8.
        run: go test ./cf-protocol/internal/wireverify/ -v -count=1

      - name: cf-authority wire-format freeze verifier (Phase 8 Gate 4)
        # Asserts that every S0b spec claim for cf-authority (Capability CBOR field IDs
        # 1–6, GrantPayload field IDs 1–4, predicate AST leaf/composite kinds, not:
        # rejection, DenyReason enum codes) matches actual code at HEAD.
        # Isolated verifier for cf-authority — sibling of wireverify (-3a8 pattern).
        # See cf-conventions/cf-authority/internal/freeze/ and campfireagent-301.
        run: go test ./cf-conventions/cf-authority/internal/freeze/ -v -count=1

      - name: GateEvaluator conformance harness — 12 cases × 3 determinism runs (Phase 8 Gate 1)
        # Runs the 12-case DefaultGateEvaluator conformance harness with -count=3 to
        # verify all cases pass and produce deterministic results on every run.
        # Triggered when any file under the relevant paths changes.
        # See cf-conventions/cf-authority/trust/conformance/ and campfireagent-1f8.
        if: |
          contains(github.event_name, 'push') ||
          contains(toJson(github.event.pull_request.files.*.filename), 'cf-conventions/cf-authority/') ||
          contains(toJson(github.event.pull_request.files.*.filename), 'cf-conventions/cf-convention/delegation/') ||
          contains(toJson(github.event.pull_request.files.*.filename), 'cf-protocol/protocol/await.go') ||
          contains(toJson(github.event.pull_request.files.*.filename), 'conformance/testdata/')
        run: go test -count=3 -v ./cf-conventions/cf-authority/trust/conformance/...
