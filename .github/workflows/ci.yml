name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run golangci-lint (depguard layer boundaries)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          args: --fast-only

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10002:10002
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./pkg/protocol/... ./pkg/convention/... -timeout 300s

      - name: Run Azurite integration tests
        run: go test -tags azurite -v ./pkg/store/aztable/...

      - name: Build check
        run: go build ./cmd/cf ./cmd/cf-mcp ./cmd/cf-functions

      - name: Vet
        run: go vet ./...
